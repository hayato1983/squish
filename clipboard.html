<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ClipSync">
<meta name="theme-color" content="#09090b">
<title>ClipSync — クリップボード</title>
<style>
  :root {
    --bg: #09090b;
    --bg-elevated: rgba(24, 24, 27, 0.78);
    --card: #141418;
    --card-hover: #1b1b21;
    --card-selected: rgba(99, 102, 241, 0.14);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #f4f4f5;
    --text-sub: #a1a1aa;
    --text-muted: #71717a;
    --accent: #6366f1;
    --accent-2: #06b6d4;
    --accent-grad: linear-gradient(135deg, #6366f1 0%, #3b82f6 55%, #06b6d4 100%);
    --amber: #f59e0b;
    --danger: #f43f5e;
    --success: #10b981;
    --radius: 16px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Noto Sans JP", sans-serif;
    min-height: 100dvh;
    overscroll-behavior-y: none;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(600px circle at 15% -10%, rgba(99, 102, 241, 0.16), transparent 60%),
      radial-gradient(500px circle at 90% 5%, rgba(6, 182, 212, 0.12), transparent 55%);
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding-bottom: calc(104px + var(--safe-bottom));
  }

  header {
    position: sticky;
    top: 0;
    z-index: 30;
    padding: calc(12px + var(--safe-top)) 16px 12px;
    background: rgba(9, 9, 11, 0.78);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--accent-grad);
    display: grid;
    place-items: center;
    box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
    flex-shrink: 0;
  }

  .brand-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .brand-sub {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 2px;
  }

  .sync-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    display: inline-block;
  }
  .sync-dot.syncing {
    background: var(--amber);
    animation: pulse 1s infinite;
  }
  .sync-dot.error {
    background: var(--danger);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .icon-btn {
    height: 36px;
    min-width: 36px;
    padding: 0 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .icon-btn:active {
    transform: scale(0.95);
    background: rgba(255, 255, 255, 0.1);
  }

  .icon-btn.active {
    background: rgba(99, 102, 241, 0.22);
    border-color: rgba(99, 102, 241, 0.5);
    color: #c7d2fe;
  }

  .quick-actions {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    margin-bottom: 12px;
  }

  .btn-primary {
    height: 44px;
    padding: 0 16px;
    border: none;
    border-radius: 12px;
    background: var(--accent-grad);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  .btn-primary:active {
    transform: scale(0.97);
    opacity: 0.9;
  }

  .btn-secondary {
    height: 44px;
    padding: 0 13px;
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-secondary:active {
    transform: scale(0.96);
    background: rgba(255, 255, 255, 0.1);
  }

  .search-wrap {
    position: relative;
    margin-bottom: 10px;
  }

  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    height: 38px;
    padding: 0 34px 0 36px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .search-input:focus {
    border-color: rgba(99, 102, 241, 0.6);
    background: rgba(255, 255, 255, 0.06);
  }

  .search-clear {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-sub);
    display: none;
    place-items: center;
    cursor: pointer;
    font-size: 13px;
  }

  .search-clear.show { display: grid; }

  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    height: 30px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-sub);
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .tab .count {
    font-size: 11px;
    opacity: 0.7;
  }

  .tab.active {
    background: #fff;
    color: #09090b;
    border-color: #fff;
  }

  .select-subbar {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
    padding: 8px 10px;
    border-radius: 12px;
    background: rgba(99, 102, 241, 0.14);
    border: 1px solid rgba(99, 102, 241, 0.35);
    font-size: 12px;
  }

  .select-subbar.show { display: flex; }

  .select-subbar-btns {
    display: flex;
    gap: 6px;
  }

  .mini-pill {
    padding: 5px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.08);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  main {
    padding: 14px 16px 0;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 14px;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    overflow: hidden;
  }

  .card.pinned {
    border-color: rgba(245, 158, 11, 0.35);
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.07) 0%, var(--card) 45%);
  }

  .card.pinned::before {
    content: "";
    position: absolute;
    left: 0;
    top: 10px;
    bottom: 10px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--amber);
  }

  .card.selected {
    background: var(--card-selected);
    border-color: var(--accent);
  }

  .card-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .checkbox {
    display: none;
    width: 22px;
    height: 22px;
    border-radius: 7px;
    border: 2px solid var(--border-strong);
    flex-shrink: 0;
    margin-top: 2px;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }

  .select-mode .checkbox {
    display: flex;
  }

  .card.selected .checkbox {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .card-content {
    flex: 1;
    min-width: 0;
  }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .badges {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  .badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 6px;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .badge-text { background: rgba(161, 161, 170, 0.16); color: #d4d4d8; }
  .badge-url { background: rgba(6, 182, 212, 0.16); color: #67e8f9; }
  .badge-image { background: rgba(168, 85, 247, 0.18); color: #d8b4fe; }
  .badge-pin { background: rgba(245, 158, 11, 0.18); color: #fcd34d; }

  .time {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .card-text {
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 6;
    -webkit-box-orient: vertical;
    overflow: hidden;
    cursor: pointer;
  }

  .card-text.url-text {
    color: #7dd3fc;
  }

  .card-image-wrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    min-height: 120px;
    max-height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .card-image-wrap img {
    width: 100%;
    max-height: 280px;
    object-fit: contain;
    display: block;
    background: #0d0d10;
  }

  .img-placeholder {
    padding: 28px 16px;
    color: var(--text-muted);
    font-size: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
  }

  .select-mode .card-footer {
    display: none;
  }

  .card-btn {
    height: 30px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-sub);
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-decoration: none;
  }

  .card-btn:active {
    transform: scale(0.95);
    background: rgba(255, 255, 255, 0.1);
  }

  .card-btn.copy-btn {
    color: #e4e4e7;
    background: rgba(99, 102, 241, 0.14);
    border-color: rgba(99, 102, 241, 0.3);
  }

  .card-btn.pinned-btn {
    color: var(--amber);
    border-color: rgba(245, 158, 11, 0.4);
    background: rgba(245, 158, 11, 0.12);
  }

  .card-btn.del-btn:hover, .card-btn.del-btn:active {
    color: var(--danger);
    border-color: rgba(244, 63, 94, 0.4);
    background: rgba(244, 63, 94, 0.12);
  }

  .empty {
    text-align: center;
    padding: 56px 20px;
    color: var(--text-muted);
  }

  .empty-icon {
    width: 52px;
    height: 52px;
    margin: 0 auto 14px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    color: var(--text-sub);
  }

  .empty h3 {
    margin: 0 0 6px;
    font-size: 15px;
    color: var(--text-sub);
  }

  .empty p {
    margin: 0;
    font-size: 13px;
    line-height: 1.5;
  }

  .bulk-bar {
    position: fixed;
    left: 50%;
    bottom: calc(16px + var(--safe-bottom));
    transform: translate(-50%, 140%);
    width: calc(100% - 32px);
    max-width: 688px;
    padding: 12px 14px;
    border-radius: 18px;
    background: rgba(24, 24, 27, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-strong);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    z-index: 40;
    transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .bulk-bar.show {
    transform: translate(-50%, 0);
  }

  .bulk-count {
    font-size: 14px;
    font-weight: 700;
  }

  .btn-danger {
    height: 40px;
    padding: 0 16px;
    border: none;
    border-radius: 11px;
    background: var(--danger);
    color: #fff;
    font-size: 13.5px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .btn-danger:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn-danger:active:not(:disabled) {
    transform: scale(0.96);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.68);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 60;
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding: 16px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  @media (min-width: 600px) {
    .modal-backdrop { align-items: center; }
  }

  .modal {
    width: 100%;
    max-width: 480px;
    background: #141418;
    border: 1px solid var(--border-strong);
    border-radius: 22px;
    padding: 20px;
    margin-bottom: var(--safe-bottom);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
    animation: slideUp 0.2s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
  }

  .field {
    margin-bottom: 14px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-sub);
    margin-bottom: 6px;
  }

  .field input, .field textarea {
    width: 100%;
    padding: 11px 12px;
    border-radius: 12px;
    border: 1px solid var(--border-strong);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }

  .field textarea {
    min-height: 120px;
    resize: vertical;
    line-height: 1.5;
  }

  .field input:focus, .field textarea:focus {
    border-color: var(--accent);
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 70;
    display: none;
    flex-direction: column;
    padding: calc(14px + var(--safe-top)) 16px calc(20px + var(--safe-bottom));
  }

  .lightbox.open { display: flex; }

  .lightbox-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .lightbox-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .lightbox-body img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 12px;
  }

  .lightbox-hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 10px;
  }

  .toast {
    position: fixed;
    top: calc(16px + var(--safe-top));
    left: 50%;
    transform: translate(-50%, -140%);
    background: rgba(24, 24, 27, 0.95);
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
    z-index: 90;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    white-space: nowrap;
    max-width: calc(100vw - 32px);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .toast.show { transform: translate(-50%, 0); }

  .spin {
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="header-top">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">ClipSync</div>
          <div class="brand-sub">
            <span class="sync-dot" id="syncDot"></span>
            <span id="syncStatus">待機中</span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="selectModeBtn" title="複数選択">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>選択</span>
        </button>
        <button class="icon-btn" id="refreshBtn" title="更新">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="設定">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

        <span>貼り付けて保存</span>
      </button>
      <button class="btn-secondary" id="pickImageBtn" title="スクショや写真から選択">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span>画像</span>
      </button>
      <button class="btn-secondary" id="manualBtn" title="手入力で保存">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </button>
      <input type="file" id="imageInput" accept="image/*" multiple hidden>
    </div>

    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput" class="search-input" placeholder="テキストやURLを検索...">
      <button class="search-clear" id="searchClear" aria-label="クリア">×</button>

    <div class="tabs" id="tabs">
      <button class="tab active" data-filter="all">すべて <span class="count" id="cnt-all">0</span></button>
      <button class="tab" data-filter="pin">ピン留め <span class="count" id="cnt-pin">0</span></button>
      <button class="tab" data-filter="image">画像 <span class="count" id="cnt-image">0</span></button>
      <button class="tab" data-filter="url">URL <span class="count" id="cnt-url">0</span></button>

</div>

      ※URLとTOKENはこの端末の中だけに保存されます。

<div class="lightbox" id="lightbox">
  <div class="lightbox-top">
    <button class="icon-btn" id="lightboxCopyBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <span>画像をコピー</span>
    </button>
    <button class="icon-btn" id="lightboxCloseBtn">閉じる ✕</button>
  </div>
  <div class="lightbox-body">
    <img id="lightboxImg" src="" alt="プレビュー">
  </div>
  <div class="lightbox-hint">画像を長押しすると写真アプリにも保存できます</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const STORAGE_URL_KEYS = ['clipsync_gas_url', 'clip_gas_url', 'gasUrl', 'GAS_URL'];
  const STORAGE_TOK_KEYS = ['clipsync_token', 'clip_token', 'token', 'TOKEN'];

  let gasUrl = loadFirst(STORAGE_URL_KEYS) || '';
  let token = loadFirst(STORAGE_TOK_KEYS) || '';
  let items = [];
  let currentFilter = 'all';
  let searchQuery = '';
  let selectMode = false;
  let selectedIds = new Set();
  let imageCache = new Map();
  let loadingImages = new Set();
  let currentLightboxDataUrl = '';
  let isBusy = false;

  const $ = id => document.getElementById(id);
  const appEl = $('app');
  const listEl = $('list');
  const syncDot = $('syncDot');
  const syncStatus = $('syncStatus');
  const searchInput = $('searchInput');
  const searchClear = $('searchClear');
  const selectModeBtn = $('selectModeBtn');
  const selectSubbar = $('selectSubbar');
  const bulkBar = $('bulkBar');
  const selectedCountEl = $('selectedCount');
  const bulkDeleteBtn = $('bulkDeleteBtn');

  function loadFirst(keys) {
    for (const k of keys) {
      const v = localStorage.getItem(k);
      if (v) return v;
    }
    return '';
  }

  function saveConfig(u, t) {
    gasUrl = u.trim();
    token = t.trim();
    localStorage.setItem(STORAGE_URL_KEYS[0], gasUrl);
    localStorage.setItem(STORAGE_TOK_KEYS[0], token);
  }

  let toastTimer = null;
  function showToast(msg, duration = 2200) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), duration);
  }

  function setSyncState(state, text) {
    syncDot.className = 'sync-dot' + (state ? ' ' + state : '');
    syncStatus.textContent = text;
  }

  window.openModal = id => $(id).classList.add('open');
  window.closeModal = id => $(id).classList.remove('open');

  async function apiGet(params = {}) {
    if (!gasUrl || !token) throw new Error('設定が未入力です');
    const url = new URL(gasUrl);
    url.searchParams.set('token', token);
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    const res = await fetch(url.toString(), { method: 'GET', cache: 'no-store' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '通信エラー');
    return data;
  }

  async function apiPost(payload) {
    if (!gasUrl || !token) throw new Error('設定が未入力です');
    const res = await fetch(gasUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token, ...payload }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '送信エラー');
    return data;
  }

  async function fetchItems(silent = false) {
    if (!gasUrl || !token) {
      openSettings();
      return;
    }
    if (!silent) setSyncState('syncing', '同期中...');
    try {
      const data = await apiGet();
      items = Array.isArray(data.items) ? data.items : [];
      items.sort((a, b) => {
        if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
        return Number(b.createdAt || 0) - Number(a.createdAt || 0);
      });
      const validIds = new Set(items.map(x => x.id));
      for (const id of [...selectedIds]) {
        if (!validIds.has(id)) selectedIds.delete(id);
      }
      render();
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      setSyncState('', `同期済 ${hh}:${mm}`);
    } catch (e) {
      setSyncState('error', '接続エラー');
      if (!silent) showToast('読み込み失敗: ' + e.message, 3200);
    }
  }

  function compressImage(fileOrBlob, maxSide = 1600) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('画像を展開できませんでした'));
        img.onload = () => {
          let { width, height } = img;
          if (width > maxSide || height > maxSide) {
            if (width >= height) {
              height = Math.round(height * (maxSide / width));
              width = maxSide;
            } else {
              width = Math.round(width * (maxSide / height));
              height = maxSide;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const mimeType = 'image/jpeg';
          const dataUrl = canvas.toDataURL(mimeType, 0.85);
          const base64 = dataUrl.split(',')[1];
          resolve({ base64, mimeType });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(fileOrBlob);
    });
  }

  async function saveImageBlob(blob) {
    setSyncState('syncing', '画像を保存中...');
    const { base64, mimeType } = await compressImage(blob, 1600);
    await apiPost({ action: 'add', imageBase64: base64, mimeType });
  }

  async function saveText(text) {
    const trimmed = String(text || '');
    if (!trimmed.trim()) {
      showToast('内容が空です');
      return;
    }
    setSyncState('syncing', '保存中...');
    await apiPost({ action: 'add', text: trimmed });
    showToast('保存しました');
    await fetchItems(true);
  }

  async function handlePasteButton() {
    if (isBusy) return;
    isBusy = true;
    try {
      if (navigator.clipboard && navigator.clipboard.read) {
        try {
          const clipItems = await navigator.clipboard.read();
          for (const clipItem of clipItems) {
            const imgType = clipItem.types.find(t => t.startsWith('image/'));
            if (imgType) {
              const blob = await clipItem.getType(imgType);
              showToast('スクショ画像を保存しています...');
              await saveImageBlob(blob);
              showToast('画像を保存しました');
              await fetchItems(true);
              return;
            }
          }
          for (const clipItem of clipItems) {
            if (clipItem.types.includes('text/plain')) {
              const blob = await clipItem.getType('text/plain');
              const text = await blob.text();
              if (text.trim()) {
                await saveText(text);
                return;
              }
            }
          }
        } catch (err) {
          if (navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            if (text && text.trim()) {
              await saveText(text);
              return;
            }
          }
          throw err;
        }
      } else if (navigator.clipboard && navigator.clipboard.readText) {
        const text = await navigator.clipboard.readText();
        if (text && text.trim()) {
          await saveText(text);
          return;
        }
      }
      showToast('クリップボードが空か、読み取れませんでした');
    } catch (e) {
      showToast('ペースト許可が必要です。手入力からも貼り付けできます', 3000);
      openModal('manualModal');
      setTimeout(() => $('manualText').focus(), 200);
    } finally {
      isBusy = false;
      setSyncState('', syncStatus.textContent.startsWith('同期済') ? syncStatus.textContent : '待機中');
    }
  }

  window.addEventListener('paste', async (e) => {
    const active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
    const dt = e.clipboardData;
    if (!dt) return;
    const files = [...dt.items].filter(i => i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
    if (files.length > 0) {
      e.preventDefault();
      try {
        showToast('画像を保存中...');
        for (const f of files) await saveImageBlob(f);
        showToast(`${files.length}枚の画像を保存しました`);
        await fetchItems(true);
      } catch (err) {
        showToast('画像保存エラー: ' + err.message);
      }
      return;
    }
    const text = dt.getData('text/plain');
    if (text && text.trim()) {
      e.preventDefault();
      try {
        await saveText(text);
      } catch (err) {
        showToast('保存エラー: ' + err.message);
      }
    }
  });

  $('pickImageBtn').addEventListener('click', () => $('imageInput').click());
  $('imageInput').addEventListener('change', async (e) => {
    const files = [...e.target.files];
    e.target.value = '';
    if (!files.length) return;
    isBusy = true;
    try {
      for (let i = 0; i < files.length; i++) {
        showToast(`画像を保存中 (${i + 1}/${files.length})...`, 4000);
        await saveImageBlob(files[i]);
      }
      showToast(`${files.length}枚の画像を保存しました`);
      await fetchItems(true);
    } catch (err) {
      showToast('画像保存失敗: ' + err.message, 3200);
    } finally {
      isBusy = false;
    }
  });

  async function copyImageDataUrl(dataUrl) {
    try {
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = dataUrl; });
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext('2d').drawImage(img, 0, 0);
      const pngBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      if (navigator.clipboard && window.ClipboardItem) {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob })]);
        showToast('画像をコピーしました');
      } else {
        throw new Error('非対応ブラウザ');
      }
    } catch (e) {
      showToast('画像をタップして長押し保存してください', 3000);
    }
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      showToast('コピーしました');
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      showToast('コピーしました');
    }
  }

  async function loadImage(fileId, imgEl, placeholderEl) {
    if (imageCache.has(fileId)) {
      imgEl.src = imageCache.get(fileId);
      imgEl.style.display = 'block';
      if (placeholderEl) placeholderEl.style.display = 'none';
      return;
    }
    if (loadingImages.has(fileId)) return;
    loadingImages.add(fileId);
    try {
      const data = await apiGet({ action: 'image', id: fileId });
      if (data.dataUrl) {
        imageCache.set(fileId, data.dataUrl);
        imgEl.src = data.dataUrl;
        imgEl.style.display = 'block';
        if (placeholderEl) placeholderEl.style.display = 'none';
      }
    } catch {
      if (placeholderEl) placeholderEl.innerHTML = '<span>画像の読み込みに失敗しました</span>';
    } finally {
      loadingImages.delete(fileId);
    }
  }

  async function togglePin(item) {
    const next = !item.pinned;
    item.pinned = next;
    items.sort((a, b) => {
      if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      return Number(b.createdAt || 0) - Number(a.createdAt || 0);
    });
    render();
    try {
      await apiPost({ action: 'pin', id: item.id, pinned: next });
      showToast(next ? 'ピン留めしました' : 'ピン留めを解除しました');
    } catch (e) {
      item.pinned = !next;
      render();
      showToast('更新エラー: ' + e.message);
    }
  }

  async function deleteSingle(item) {
    if (!confirm('この項目を削除しますか？')) return;
    items = items.filter(x => x.id !== item.id);
    render();
    try {
      await apiPost({ action: 'delete', id: item.id });
      showToast('削除しました');
    } catch (e) {
      showToast('削除エラー: ' + e.message);
      fetchItems(true);
    }
  }

  function setSelectMode(on) {
    selectMode = on;
    if (!on) selectedIds.clear();
    appEl.classList.toggle('select-mode', on);
    selectModeBtn.classList.toggle('active', on);
    selectModeBtn.querySelector('span').textContent = on ? '完了' : '選択';
    selectSubbar.classList.toggle('show', on);
    bulkBar.classList.toggle('show', on);
    updateBulkUI();
    render();
  }

  function updateBulkUI() {
    const n = selectedIds.size;
    selectedCountEl.textContent = n;
    bulkDeleteBtn.disabled = n === 0;
  }

  async function executeBulkDelete() {
    const ids = [...selectedIds];
    if (!ids.length) return;
    if (!confirm(`選択した ${ids.length} 件を一気に削除しますか？\n（この操作は元に戻せません）`)) return;

    bulkDeleteBtn.disabled = true;
    setSyncState('syncing', `削除中 0/${ids.length}`);
    let done = 0;
    let failed = 0;

    for (const id of ids) {
      try {
        await apiPost({ action: 'delete', id });
        items = items.filter(x => x.id !== id);
        selectedIds.delete(id);
      } catch {
        failed++;
      }
      done++;
      setSyncState('syncing', `削除中 ${done}/${ids.length}`);
      showToast(`削除中... (${done}/${ids.length})`, 3000);
    }

    setSelectMode(false);
    setSyncState('', '同期済');
    if (failed === 0) {
      showToast(`${done}件を一気に削除しました`);
    } else {
      showToast(`${done - failed}件削除（${failed}件失敗）`, 3200);
      fetchItems(true);
    }
  }

  function getFilteredItems() {
    const q = searchQuery.trim().toLowerCase();
    return items.filter(item => {
      if (currentFilter === 'pin' && !item.pinned) return false;
      if (currentFilter === 'image' && item.type !== 'image') return false;
      if (currentFilter === 'url' && item.type !== 'url') return false;
      if (currentFilter === 'text' && item.type !== 'text') return false;
      if (q) {
        const t = String(item.text || '').toLowerCase();
        return t.includes(q);
      }
      return true;
    });
  }

  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(Number(ts));
    if (isNaN(d.getTime())) return '';
    const diff = Date.now() - d.getTime();
    if (diff < 60000) return 'たった今';
    if (diff < 3600000) return `${Math.floor(diff / 60000)}分前`;
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    if (sameDay) return `今日 ${hh}:${mm}`;
    return `${d.getMonth() + 1}/${d.getDate()} ${hh}:${mm}`;
  }

  function updateCounts() {
    $('cnt-all').textContent = items.length;
    $('cnt-pin').textContent = items.filter(i => i.pinned).length;
    $('cnt-image').textContent = items.filter(i => i.type === 'image').length;
    $('cnt-url').textContent = items.filter(i => i.type === 'url').length;
    $('cnt-text').textContent = items.filter(i => i.type === 'text').length;
  }

  function render() {
    updateCounts();
    const filtered = getFilteredItems();
    listEl.innerHTML = '';

    if (!filtered.length) {
      listEl.innerHTML = `
        <div class="empty">
          <div class="empty-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
          </div>
          <h3>${searchQuery ? '一致する項目がありません' : 'まだクリップがありません'}</h3>
          <p>${searchQuery ? '検索ワードを変えてみてください' : '上の「貼り付けて保存」や「画像」から<br>テキストやスクショを一時保管できます'}</p>
        </div>
      `;
      return;
    }

    const frag = document.createDocumentFragment();
    for (const item of filtered) {
      const card = document.createElement('div');
      card.className = 'card' + (item.pinned ? ' pinned' : '') + (selectedIds.has(item.id) ? ' selected' : '');

      const typeLabel = item.type === 'image' ? 'IMAGE' : item.type === 'url' ? 'URL' : 'TEXT';
      const badgeClass = item.type === 'image' ? 'badge-image' : item.type === 'url' ? 'badge-url' : 'badge-text';

      card.innerHTML = `
        <div class="card-row">
          <div class="checkbox">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="card-content">
            <div class="card-meta">
              <div class="badges">
                <span class="badge ${badgeClass}">${typeLabel}</span>
                ${item.pinned ? '<span class="badge badge-pin">PIN</span>' : ''}
              </div>
              <span class="time">${formatTime(item.createdAt)}</span>
            </div>
            <div class="card-body"></div>
            <div class="card-footer"></div>
          </div>
        </div>
      `;

      const bodyEl = card.querySelector('.card-body');
      const footerEl = card.querySelector('.card-footer');

      if (item.type === 'image') {
        const wrap = document.createElement('div');
        wrap.className = 'card-image-wrap';
        const img = document.createElement('img');
        img.style.display = 'none';
        img.alt = '保存された画像';
        const ph = document.createElement('div');
        ph.className = 'img-placeholder';
        ph.innerHTML = '<span>画像を読み込み中...</span>';
        wrap.appendChild(img);
        wrap.appendChild(ph);
        bodyEl.appendChild(wrap);

        loadImage(item.fileId, img, ph);

        wrap.addEventListener('click', (e) => {
          if (selectMode) return;
          e.stopPropagation();
          const url = imageCache.get(item.fileId);
          if (!url) return;
          currentLightboxDataUrl = url;
          $('lightboxImg').src = url;
          $('lightbox').classList.add('open');
        });

        const copyImgBtn = document.createElement('button');
        copyImgBtn.className = 'card-btn copy-btn';
        copyImgBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>コピー</span>`;
        copyImgBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const url = imageCache.get(item.fileId);
          if (url) copyImageDataUrl(url);
          else showToast('画像読み込み中です');
        });
        footerEl.appendChild(copyImgBtn);
      } else {
        const textDiv = document.createElement('div');
        textDiv.className = 'card-text' + (item.type === 'url' ? ' url-text' : '');
        textDiv.textContent = item.text || '';
        textDiv.addEventListener('click', (e) => {
          if (selectMode) return;
          e.stopPropagation();
          copyText(item.text || '');
        });
        bodyEl.appendChild(textDiv);

        if (item.type === 'url') {
          const openA = document.createElement('a');
          openA.className = 'card-btn';
          openA.href = item.text;
          openA.target = '_blank';
          openA.rel = 'noopener noreferrer';
          openA.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg><span>開く</span>`;
          openA.addEventListener('click', e => e.stopPropagation());
          footerEl.appendChild(openA);
        }

        const copyBtn = document.createElement('button');
        copyBtn.className = 'card-btn copy-btn';
        copyBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>コピー</span>`;
        copyBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          copyText(item.text || '');
        });
        footerEl.appendChild(copyBtn);
      }

      const pinBtn = document.createElement('button');
      pinBtn.className = 'card-btn' + (item.pinned ? ' pinned-btn' : '');
      pinBtn.title = 'ピン留め';
      pinBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="${item.pinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.2"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>`;
      pinBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        togglePin(item);
      });
      footerEl.appendChild(pinBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'card-btn del-btn';
      delBtn.title = '削除';
      delBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>`;
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteSingle(item);
      });
      footerEl.appendChild(delBtn);

      card.addEventListener('click', () => {
        if (!selectMode) return;
        if (selectedIds.has(item.id)) selectedIds.delete(item.id);
        else selectedIds.add(item.id);
        card.classList.toggle('selected', selectedIds.has(item.id));
        updateBulkUI();
      });

      frag.appendChild(card);
    }

    listEl.appendChild(frag);
  }

  function openSettings() {
    $('gasUrlInput').value = gasUrl;
    $('tokenInput').value = token;
    openModal('settingsModal');
  }

  $('settingsBtn').addEventListener('click', openSettings);
  $('saveSettingsBtn').addEventListener('click', () => {
    const u = $('gasUrlInput').value.trim();
    const t = $('tokenInput').value.trim();
    if (!u || !t) {
      showToast('URLとTOKENを入力してください');
      return;
    }
    saveConfig(u, t);
    closeModal('settingsModal');
    fetchItems(false);
  });

  $('pasteBtn').addEventListener('click', handlePasteButton);
  $('refreshBtn').addEventListener('click', () => fetchItems(false));

  $('manualBtn').addEventListener('click', () => {
    $('manualText').value = '';
    openModal('manualModal');
    setTimeout(() => $('manualText').focus(), 180);
  });

  $('saveManualBtn').addEventListener('click', async () => {
    const txt = $('manualText').value;
    if (!txt.trim()) { showToast('内容を入力してください'); return; }
    closeModal('manualModal');
    try {
      await saveText(txt);
    } catch (e) {
      showToast('保存失敗: ' + e.message);
    }
  });

  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value;
    searchClear.classList.toggle('show', !!searchQuery);
    render();
  });

  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchQuery = '';
    searchClear.classList.remove('show');
    render();
  });

  $('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    currentFilter = btn.dataset.filter;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
    render();
  });

  selectModeBtn.addEventListener('click', () => setSelectMode(!selectMode));
  $('cancelSelectBtn').addEventListener('click', () => setSelectMode(false));
  bulkDeleteBtn.addEventListener('click', executeBulkDelete);

  $('selectAllBtn').addEventListener('click', () => {
    const visible = getFilteredItems();
    const allSelected = visible.length > 0 && visible.every(i => selectedIds.has(i.id));
    if (allSelected) {
      visible.forEach(i => selectedIds.delete(i.id));
    } else {
      visible.forEach(i => selectedIds.add(i.id));
    }
    updateBulkUI();
    render();
  });

  $('selectUnpinnedBtn').addEventListener('click', () => {
    const visible = getFilteredItems();
    selectedIds.clear();
    visible.filter(i => !i.pinned).forEach(i => selectedIds.add(i.id));
    updateBulkUI();
    render();
  });

  $('lightboxCloseBtn').addEventListener('click', () => $('lightbox').classList.remove('open'));
  $('lightbox').addEventListener('click', (e) => {
    if (e.target === $('lightbox') || e.target.classList.contains('lightbox-body')) {
      $('lightbox').classList.remove('open');
    }
  });
  $('lightboxCopyBtn').addEventListener('click', () => {
    if (currentLightboxDataUrl) copyImageDataUrl(currentLightboxDataUrl);
  });

  setInterval(() => {
    if (!document.hidden && !selectMode && !isBusy && gasUrl && token) {
      fetchItems(true);
    }
  }, 30000);

  if (gasUrl && token) {
    fetchItems(false);
  } else {
    openSettings();
  }
})();
</script>
</body>
</html>
