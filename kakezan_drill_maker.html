<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>かけざんドリルメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF8F1;
    --paper-deep: #F3EEE1;
    --ink: #2B2A28;
    --ink-soft: #6b6459;
    --sora: #3F7192;
    --sora-soft: #E4EEF3;
    --mori: #5C7F4F;
    --mori-soft: #E9F0E3;
    --ichigo: #BC5170;
    --ichigo-soft: #F7E7EB;
    --line: #DCD5C3;
    --card: #FFFFFF;
    --shadow: rgba(60, 50, 30, 0.08);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
  }
  body {
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .app-shell {
    max-width: 840px;
    margin: 0 auto;
    padding: 20px 16px 64px;
  }
  header.top {
    background: var(--paper);
    padding: 6px 0 14px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  header.top h1 {
    font-family: "Shippori Mincho", serif;
    font-size: 1.5rem;
    margin: 0 0 6px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px var(--shadow);
  }
  .card h2 {
    font-family: "Shippori Mincho", serif;
    font-size: 1.15rem;
    margin: 0 0 12px;
  }
  .muted { color: var(--ink-soft); font-size: 0.88rem; }
  .dan-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 0 14px;
  }
  .dan-btn {
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }
  .dan-btn.active {
    background: var(--sora);
    border-color: var(--sora);
    color: #fff;
  }
  .opt-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin: 12px 0;
  }
  .opt-group {
    flex: 1;
    min-width: 180px;
  }
  label.field-label { display: block; font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 6px; }
  select, input[type="text"] {
    width: 100%;
    font-family: inherit;
    font-size: 0.95rem;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
  }
  .row-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .btn {
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    color: #fff;
  }
  .btn-primary { background: var(--ichigo); }
  .btn-secondary { background: var(--sora); }
  .btn-ghost {
    background: transparent;
    color: var(--sora);
    border: 1px solid var(--sora);
  }

  /* ---- A4 worksheet ---- */
  .preview-wrap {
    background: var(--paper-deep);
    border-radius: 14px;
    padding: 14px;
    overflow-x: auto;
  }
  .sheet {
    font-family: "Shippori Mincho", serif;
    background: #fff;
    color: #201f1c;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12mm 12mm;
    width: 100%;
    max-width: 210mm;
    margin: 0 auto;
  }
  .sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid #3F7192;
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  .sheet-title {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .sheet-meta {
    display: flex;
    gap: 14px;
    font-size: 0.85rem;
    color: #4a453c;
  }
  .sheet-meta span {
    border-bottom: 1px solid #888;
    padding: 0 4px 2px;
    min-width: 68px;
    display: inline-block;
  }
  .q-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 24px;
    margin-top: 8px;
  }
  .q-item {
    display: flex;
    align-items: center;
    border-bottom: 1px dashed #d5cebc;
    padding: 7px 4px;
    font-size: 1.25rem;
  }
  .q-num {
    font-size: 0.8rem;
    color: #7a7469;
    width: 28px;
  }
  .q-expr {
    flex: 1;
    letter-spacing: 0.06em;
  }
  .q-yomi {
    display: block;
    font-size: 0.72rem;
    color: #5C7F4F;
    font-family: "Zen Maru Gothic", sans-serif;
    margin-top: 2px;
  }
  .q-box {
    width: 54px;
    height: 36px;
    border: 1.5px solid #3F7192;
    border-radius: 6px;
    background: #fcfbf7;
  }
  .sheet-foot {
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: #6b6459;
  }

  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; }
    .sheet { border: none; box-shadow: none; max-width: none; padding: 8mm 8mm; }
    @page { size: A4; margin: 10mm; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <header class="top">
    <h1>かけざんドリルメーカー</h1>
    <div class="muted">段とモードを選んで、A4サイズのかけ算（九九）プリントをすぐに作れます。</div>
  </header>

  <div class="card">
    <h2>① だん を えらぶ（複数選択OK）</h2>
    <div class="dan-grid" id="danGrid"></div>
    <div class="row-actions" style="margin-top:0;">
      <button class="btn btn-ghost" id="selectAllBtn" style="padding:6px 12px; font-size:0.82rem;">ぜんぶ（1〜9の段）</button>
      <button class="btn btn-ghost" id="selectHardBtn" style="padding:6px 12px; font-size:0.82rem;">まちがえやすい段（6・7・8の段）</button>
    </div>

    <div class="opt-row">
      <div class="opt-group">
        <label class="field-label">② ならびかた</label>
        <select id="orderSelect">
          <option value="asc">じゅんばん通り（上がり九九：×1 → ×9）</option>
          <option value="desc">ぎゃくから（下がり九九：×9 → ×1）</option>
          <option value="mix" selected>バラバラ（ランダムミックス）</option>
        </select>
      </div>
      <div class="opt-group">
        <label class="field-label">③ もんだいすう</label>
        <select id="countSelect">
          <option value="18">18もん（ゆったり練習）</option>
          <option value="20">20もん（標準テスト）</option>
          <option value="30" selected>30もん（たっぷりチャレンジ）</option>
        </select>
      </div>
      <div class="opt-group">
        <label class="field-label">④ よみがな（くくの読み）</label>
        <select id="yomiSelect">
          <option value="off" selected>なし（テスト用）</option>
          <option value="on">あり（れんしゅう用）</option>
        </select>
      </div>
    </div>

    <div class="row-actions">
      <button class="btn btn-secondary" id="generateBtn">もんだいをつくる（シャッフル）</button>
      <button class="btn btn-primary" id="printBtn">A4で印刷 / PDFで保存</button>
    </div>
  </div>

  <div class="card">
    <h2>プレビュー</h2>
    <div class="preview-wrap" id="previewWrap"></div>
  </div>
</div>

<div id="print-area" style="display:none;"></div>

<script>
(function () {
  "use strict";

  var KUKU_YOMI = {
    "1x1":"いんいちが いち","1x2":"いんにが に","1x3":"いんさんが さん","1x4":"いんしが し","1x5":"いんごが ご","1x6":"いんろくが ろく","1x7":"いんしちが しち","1x8":"いんはちが はち","1x9":"いんくが く",
    "2x1":"にいちが に","2x2":"ににんが し","2x3":"にさんが ろく","2x4":"にしが はち","2x5":"にご じゅう","2x6":"にろく じゅうに","2x7":"にしち じゅうし","2x8":"にはち じゅうろく","2x9":"にく じゅうはち",
    "3x1":"さんいちが さん","3x2":"さんにが ろく","3x3":"さざんが く","3x4":"さんし じゅうに","3x5":"さんご じゅうご","3x6":"さぶろく じゅうはち","3x7":"さんしち にじゅういち","3x8":"さんぱ にじゅうし","3x9":"さんく にじゅうしち",
    "4x1":"しいちが し","4x2":"しにが はち","4x3":"しさん じゅうに","4x4":"しし じゅうろく","4x5":"しご にじゅう","4x6":"しろく にじゅうし","4x7":"ししち にじゅうはち","4x8":"しは さんじゅうに","4x9":"しく さんじゅうろく",
    "5x1":"ごいちが ご","5x2":"ごに じゅう","5x3":"ごさん じゅうご","5x4":"ごし にじゅう","5x5":"ごご にじゅうご","5x6":"ごろく さんじゅう","5x7":"ごしち さんじゅうご","5x8":"ごは しじゅう","5x9":"ごっく しじゅうご",
    "6x1":"ろくいちが ろく","6x2":"ろくに じゅうに","6x3":"ろくさん じゅうはち","6x4":"ろくし にじゅうし","6x5":"ろくご さんじゅう","6x6":"ろくろく さんじゅうろく","6x7":"ろくしち しじゅうに","6x8":"ろくは しじゅうはち","6x9":"ろっく ごじゅうし",
    "7x1":"しちいちが しち","7x2":"しちに じゅうし","7x3":"しちさん にじゅういち","7x4":"しちし にじゅうはち","7x5":"しちご さんじゅうご","7x6":"しちろく しじゅうに","7x7":"しちしち しじゅうく","7x8":"しちは ごじゅうろく","7x9":"しちく ろくじゅうさん",
    "8x1":"はちいちが はち","8x2":"はちに じゅうろく","8x3":"はちさん にじゅうし","8x4":"はちし さんじゅうに","8x5":"はちご しじゅう","8x6":"はちろく しじゅうはち","8x7":"はちしち ごじゅうろく","8x8":"はっぱ ろくじゅうし","8x9":"はっく しちじゅうに",
    "9x1":"くいちが く","9x2":"くに じゅうはち","9x3":"くさん にじゅうしち","9x4":"くし さんじゅうろく","9x5":"くご しじゅうご","9x6":"くろく ごじゅうし","9x7":"くしち ろくじゅうさん","9x8":"くは しちじゅうに","9x9":"くく はちじゅういち"
  };

  var selectedDans = [2, 3, 4, 5];
  var currentProblems = [];

  function renderDanButtons() {
    var grid = document.getElementById("danGrid");
    var html = "";
    for (var d = 1; d <= 9; d++) {
      var active = selectedDans.indexOf(d) !== -1 ? " active" : "";
      html += '<button type="button" class="dan-btn' + active + '" data-dan="' + d + '">' + d + 'の段</button>';
    }
    grid.innerHTML = html;
    grid.querySelectorAll(".dan-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var dan = parseInt(btn.getAttribute("data-dan"), 10);
        var idx = selectedDans.indexOf(dan);
        if (idx === -1) selectedDans.push(dan);
        else if (selectedDans.length > 1) selectedDans.splice(idx, 1);
        selectedDans.sort(function (a, b) { return a - b; });
        renderDanButtons();
        buildProblems();
      });
    });
  }

  function buildProblems() {
    var order = document.getElementById("orderSelect").value;
    var count = parseInt(document.getElementById("countSelect").value, 10);
    var pool = [];

    selectedDans.forEach(function (d) {
      if (order === "desc") {
        for (var m = 9; m >= 1; m--) pool.push({ a: d, b: m });
      } else {
        for (var m = 1; m <= 9; m++) pool.push({ a: d, b: m });
      }
    });

    if (order === "mix") {
      var list = [];
      while (list.length < count) {
        var copy = pool.slice();
        for (var i = copy.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
        }
        list = list.concat(copy);
      }
      currentProblems = list.slice(0, count);
    } else {
      currentProblems = pool.slice(0, count);
    }
    renderSheet();
  }

  function getSheetHtml() {
    var showYomi = document.getElementById("yomiSelect").value === "on";
    var danLabel = selectedDans.length === 9 ? "ぜんぶの段" : selectedDans.join("・") + "の段";
    var itemsHtml = currentProblems.map(function (p, idx) {
      var yomi = showYomi ? '<span class="q-yomi">' + KUKU_YOMI[p.a + "x" + p.b] + '</span>' : '';
      return '<div class="q-item">' +
        '<div class="q-num">(' + (idx + 1) + ')</div>' +
        '<div class="q-expr">' + p.a + ' × ' + p.b + ' ＝' + yomi + '</div>' +
        '<div class="q-box"></div>' +
      '</div>';
    }).join("");

    return '<div class="sheet">' +
      '<div class="sheet-header">' +
        '<div class="sheet-title">かけざん ドリル（' + danLabel + '）</div>' +
        '<div class="sheet-meta">' +
          '<span>なまえ</span>' +
          '<span>ひづけ</span>' +
          '<span>てんすう　　／' + currentProblems.length + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="q-grid">' + itemsHtml + '</div>' +
      '<div class="sheet-foot">' +
        '<span>タイム：　　　ふん　　　びょう</span>' +
        '<span>よく できました！</span>' +
      '</div>' +
    '</div>';
  }

  function renderSheet() {
    document.getElementById("previewWrap").innerHTML = getSheetHtml();
  }

  document.getElementById("selectAllBtn").addEventListener("click", function () {
    selectedDans = [1, 2, 3, 4, 5, 6, 7, 8, 9];
    renderDanButtons();
    buildProblems();
  });

  document.getElementById("selectHardBtn").addEventListener("click", function () {
    selectedDans = [6, 7, 8];
    renderDanButtons();
    buildProblems();
  });

  document.getElementById("orderSelect").addEventListener("change", buildProblems);
  document.getElementById("countSelect").addEventListener("change", buildProblems);
  document.getElementById("yomiSelect").addEventListener("change", renderSheet);
  document.getElementById("generateBtn").addEventListener("click", buildProblems);

  document.getElementById("printBtn").addEventListener("click", function () {
    var area = document.getElementById("print-area");
    area.innerHTML = getSheetHtml();
    area.style.display = "block";
    setTimeout(function () {
      window.print();
      area.style.display = "none";
      area.innerHTML = "";
    }, 80);
  });

  renderDanButtons();
  buildProblems();
})();
</script>
</body>
</html>
